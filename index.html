
    <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hey Ella 💌</title>
<style>
  :root {
    --bg: #fff1f4;
    --card: #ffffff;
    --ink: #3a1c28;
    --muted: #8a6573;
    --accent: #e8386d;
    --accent-ink: #ffffff;
    --sleep: #e9dde1;
    --sleep-ink: #a38f97;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1015;
      --card: #2a1820;
      --ink: #ffeaf0;
      --muted: #c79aab;
      --accent: #ff5c8a;
      --accent-ink: #2a0b15;
      --sleep: #3a2630;
      --sleep-ink: #8c6c79;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; min-height: 100%; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
  }

  .card {
    background: var(--card);
    border-radius: 24px;
    padding: clamp(24px, 6vw, 40px) clamp(20px, 5vw, 32px);
    width: 100%;
    max-width: 440px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(232, 56, 109, 0.18);
  }

  .emoji {
    font-size: clamp(44px, 14vw, 64px);
    animation: float 2.4s ease-in-out infinite;
  }
  @keyframes float { 50% { transform: translateY(-8px); } }

  h1 {
    font-size: clamp(22px, 6.5vw, 30px);
    line-height: 1.25;
    margin: 14px 0 8px;
  }

  p {
    color: var(--muted);
    margin: 0 0 clamp(20px, 5vw, 28px);
    font-size: clamp(15px, 4vw, 17px);
    line-height: 1.5;
  }

  .btns {
    display: flex;
    gap: 14px;
    justify-content: center;
    align-items: center;
  }

  a.yes, button.no {
    font: inherit;
    font-size: 18px;
    border: 0;
    border-radius: 999px;
    padding: 15px 32px;
    min-height: 52px;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  a.yes {
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: bold;
    transition: transform 0.2s;
  }
  a.yes:hover, a.yes:active { transform: scale(1.06); }

  button.no {
    background: var(--sleep);
    color: var(--sleep-ink);
    cursor: not-allowed;
  }
  button.no.shake { animation: shake 0.4s; }
  @keyframes shake {
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  #msg {
    min-height: 24px;
    margin-top: 20px;
    color: var(--accent);
    font-size: 15px;
  }

  /* Phones: stack the buttons and make them full width */
  @media (max-width: 480px) {
    .btns { flex-direction: column; }
    a.yes, button.no { width: 100%; }
    a.yes { order: 1; }
    button.no { order: 2; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="emoji">💌</div>
    <h1>Ella, will you go on a date with me?</h1>
    <p>I promise good vibes, good food, and zero awkward silences.</p>

    <div class="btns">
      <a class="yes" id="yes" href="#">Yes 💖</a>
      <button class="no" id="no" aria-disabled="true">No</button>
    </div>

    <div id="msg" aria-live="polite"></div>
  </main>
    <script src="/script.js"></script>
</body>
</html>
